<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SabiSyllabus AI — Autonomous Academic Roadmap Synthesis</title>
    <meta
      name="description"
      content="SabiSyllabus AI is an advanced, autonomous academic optimization tool engineered by GentleCoder. Instantly clean, parse, and synthesize chaotic university syllabi, textbook outlines, or unformatted course texts into structured, week-by-week learning roadmaps. Built for students and self-learners mastering heavy technical modules."
    />
    <meta
      name="keywords"
      content="SabiSyllabus AI, GentleCoder, Oluwatosin Oyelakin, syllabus parser, academic roadmap synthesis, university course outline cleaner, study planner generator, curriculum optimizer, learning roadmap creator, EdTech utility app, AI study tools"
    />
    <meta name="author" content="GentleCoder" />
    <meta property="og:title" content="SabiSyllabus AI — Clean Your Course Layouts Automatically" />
    <meta
      property="og:description"
      content="Stop fighting messy syllabus PDFs, unformatted text files, or chaotic group chat outlines. Ingest any unstructured curriculum text and instantly synthesize a clean, chronological study roadmap. Engineered by GentleCoder."
    />
    <meta property="og:image" content="assets/og-image.png" />
    <meta property="og:url" content="https://gentlecoder.vercel.app" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SabiSyllabus AI Platform" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="SabiSyllabus AI — Autonomous Academic Roadmap Synthesis"
    />
    <meta
      name="twitter:description"
      content="An advanced global EdTech tool by by GentleCoder to parse unstructured curricula into clean, actionable learning roadmaps."
    />
    <meta name="twitter:image" content="assets/og-image.png" />
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/og-image.png" />
    <meta name="theme-color" content="#030303" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body class="relative flex min-h-screen flex-col justify-between overflow-x-hidden bg-[#0a0a0c] p-4 text-zinc-100 antialiased md:p-8">
    <div
      class="pointer-events-none absolute left-1/2 top-0 -z-10 h-[350px] w-[500px] -translate-x-1/2 rounded-full bg-gradient-to-b from-cyan-500/10 via-indigo-500/5 to-transparent blur-[80px] md:w-[800px]"
      aria-hidden="true"
    ></div>

    <header class="relative z-10 mx-auto w-full max-w-2xl py-8 text-center md:py-12">
      <div
        class="mb-4 inline-block rounded-full border border-cyan-800/40 bg-cyan-950/50 px-2.5 py-1 font-mono text-[10px] font-bold uppercase tracking-widest text-cyan-400 shadow-[0_0_15px_rgba(34,211,238,0.1)]"
      >
        Core Engine v1.0
      </div>
      <div class="relative mx-auto mb-5 grid h-28 w-28 place-items-center md:h-32 md:w-32">
        <span
          class="absolute inset-0 rounded-full border border-dashed border-cyan-400/30 animate-[spin_24s_linear_infinite]"
          aria-hidden="true"
        ></span>
        <span
          class="absolute right-1 top-4 h-2 w-2 rounded-full bg-cyan-300 shadow-[0_0_12px_rgba(103,232,249,0.9)]"
          aria-hidden="true"
        ></span>
        <img
          src="./assets/favicon.ico"
          alt="SabiSyllabus AI logo"
          class="h-20 w-20 rounded-full border-2 border-cyan-300 bg-zinc-950 p-1 object-cover brightness-150 contrast-125 saturate-150 shadow-[0_0_36px_rgba(34,211,238,0.55)] ring-4 ring-cyan-400/20 transition-transform duration-300 hover:scale-105 select-none md:h-24 md:w-24"
        />
      </div>
      <h1 class="mb-2 text-4xl font-black tracking-tight text-white md:text-5xl">
        SabiSyllabus AI
      </h1>
      <p class="mx-auto max-w-md bg-gradient-to-r from-zinc-400 via-zinc-200 to-zinc-500 bg-clip-text font-mono text-sm uppercase tracking-wider text-transparent">
        Autonomous Academic Roadmap Synthesis
      </p>
      <div class="mx-auto mt-5 inline-flex items-center gap-2 rounded-full border border-cyan-900/60 bg-cyan-950/30 px-3 py-1.5 font-mono text-[10px] font-semibold uppercase tracking-[0.16em] text-cyan-300 shadow-[0_0_24px_rgba(34,211,238,0.08)]">
        <svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M10 1.75 11.9 7l5.35 1.9L11.9 10.8 10 16.05 8.1 10.8 2.75 8.9 8.1 7 10 1.75Zm6.25 10.5.95 2.55 2.55.95-2.55.95-.95 2.55-.95-2.55-2.55-.95 2.55-.95.95-2.55Z" />
        </svg>
        AI-powered study intelligence
        <span class="h-1.5 w-1.5 rounded-full bg-cyan-300 shadow-[0_0_8px_rgba(103,232,249,0.9)]" aria-hidden="true"></span>
      </div>
    </header>

    <main
      class="relative mx-auto w-full max-w-2xl space-y-6 rounded-2xl border border-zinc-800/80 bg-zinc-900/30 p-6 shadow-[0_20px_50px_rgba(0,0,0,0.5)] backdrop-blur-xl before:absolute before:inset-0 before:-z-10 before:rounded-2xl before:bg-gradient-to-b before:from-zinc-700/30 before:to-transparent before:p-px md:p-8"
      aria-label="Syllabus roadmap workspace"
    >
      <form id="roadmapForm" class="space-y-6" novalidate>
        <div>
          <div
            id="dropzone"
            class="group relative flex min-h-52 cursor-pointer flex-col items-center justify-center overflow-hidden rounded-xl border border-dashed border-zinc-800 bg-zinc-950/40 p-8 text-center shadow-inner transition-all duration-300 hover:border-cyan-500/50 hover:bg-zinc-900/40 focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-500/50"
            role="button"
            tabindex="0"
            aria-controls="fileInput"
            aria-describedby="fileHelp fileSpecs"
          >
            <span
              class="mb-4 flex h-12 w-12 items-center justify-center rounded-xl border border-zinc-800 bg-zinc-900 text-zinc-400 transition-colors group-hover:border-cyan-500/30 group-hover:text-cyan-300"
              aria-hidden="true"
            >
              <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none">
                <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14.5v3A2.5 2.5 0 0 0 7.5 20h9a2.5 2.5 0 0 0 2.5-2.5v-3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <span class="text-sm font-medium text-zinc-200">
              Drop your syllabus here or <span class="text-cyan-400">browse files</span>
            </span>
            <span id="fileHelp" class="mt-2 text-xs leading-5 text-zinc-500">
              PDF, DOCX, PNG, JPG, or TXT · Maximum size 20 MB
            </span>
          </div>
          <input
            id="fileInput"
            class="sr-only"
            type="file"
            accept=".pdf,.docx,.png,.jpg,.jpeg,.txt,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/png,image/jpeg,text/plain"
            aria-label="Choose a syllabus file"
          />
          <div
            id="fileSpecs"
            class="mt-3 hidden items-center justify-between gap-3 rounded-xl border border-zinc-800 bg-zinc-950/70 px-3 py-2 text-xs text-zinc-300"
            aria-live="polite"
          >
            <span id="fileName" class="min-w-0 truncate font-mono"></span>
            <button
              id="removeFileBtn"
              type="button"
              class="shrink-0 rounded-lg px-2 py-1 font-medium text-zinc-500 transition hover:bg-zinc-900 hover:text-rose-300 focus:outline-none focus:ring-2 focus:ring-cyan-500/50"
              aria-label="Remove selected syllabus file"
            >
              Remove
            </button>
          </div>
        </div>

        <div>
          <label for="rawText" class="mb-2.5 block text-sm font-medium text-zinc-400">
            Or paste raw outline text:
          </label>
          <textarea
            id="rawText"
            rows="5"
            class="w-full rounded-xl border border-zinc-800/80 bg-[#0d0d11]/90 p-4 font-mono text-sm text-zinc-300 shadow-2xl transition-colors duration-200 focus:border-cyan-500/50 focus:outline-none focus:ring-1 focus:ring-cyan-500/30"
            aria-describedby="formMessage inputStatus"
          ></textarea>
        </div>

        <p
          id="inputStatus"
          class="hidden text-xs text-zinc-500"
          role="status"
          aria-live="polite"
        ></p>
        <p
          id="formMessage"
          class="hidden rounded-xl border border-rose-400/20 bg-rose-400/5 px-4 py-3 text-sm text-rose-200"
          role="alert"
        ></p>

        <button
          id="optimizeBtn"
          type="submit"
          class="relative w-full select-none overflow-hidden rounded-xl border border-white/20 bg-white py-4 text-sm font-bold tracking-wide text-zinc-950 shadow-[0_4px_20px_rgba(255,255,255,0.08)] transition-all hover:bg-zinc-100 active:scale-[0.99] disabled:cursor-wait disabled:opacity-70"
          aria-busy="false"
        >
          <span class="inline-flex items-center justify-center gap-3">
            <img
              id="loadingLogo"
              src="./assets/favicon.ico"
              alt=""
              class="hidden h-9 w-9 shrink-0 rounded-full border border-cyan-300 bg-zinc-950 object-cover p-0.5 brightness-150 contrast-125 saturate-150 shadow-[0_0_30px_rgba(34,211,238,0.75)] ring-4 ring-cyan-400/30 drop-shadow-[0_0_10px_rgba(34,211,238,0.8)] transition-all duration-300"
              aria-hidden="true"
            />
            <span id="optimizeBtnLabel">Optimize Learning Roadmap</span>
          </span>
        </button>
      </form>

      <section
        id="outputWrapper"
        class="hidden opacity-0 transition-opacity duration-500"
        aria-labelledby="outputHeading"
        aria-live="polite"
      >
        <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <p class="font-mono text-[10px] font-semibold uppercase tracking-[0.15em] text-zinc-500">
              Your study plan
            </p>
            <h2 id="outputHeading" class="mt-1 text-base font-semibold text-zinc-100">
              Roadmap ready
            </h2>
          </div>
          <div class="flex flex-wrap gap-2">
            <button
              id="editInputBtn"
              type="button"
              class="rounded-xl border border-zinc-800 bg-zinc-950 px-3 py-2 text-xs font-medium text-zinc-400 transition hover:border-cyan-500/40 hover:text-cyan-300 focus:outline-none focus:ring-2 focus:ring-cyan-500/40"
            >
              Edit input
            </button>
            <button
              id="downloadBtn"
              type="button"
              class="rounded-xl border border-zinc-800 bg-zinc-950 px-3 py-2 text-xs font-medium text-zinc-400 transition hover:border-cyan-500/40 hover:text-cyan-300 focus:outline-none focus:ring-2 focus:ring-cyan-500/40"
            >
              Download .md
            </button>
            <button
              id="copyBtn"
              type="button"
              class="rounded-xl border border-zinc-800 bg-zinc-950 px-3 py-2 text-xs font-medium text-zinc-400 transition hover:border-cyan-500/40 hover:text-cyan-300 focus:outline-none focus:ring-2 focus:ring-cyan-500/40"
            >
              Copy Content
            </button>
            <button
              id="startOverBtn"
              type="button"
              class="rounded-xl border border-zinc-800 bg-zinc-950 px-3 py-2 text-xs font-medium text-zinc-500 transition hover:border-rose-500/40 hover:text-rose-300 focus:outline-none focus:ring-2 focus:ring-cyan-500/40"
            >
              Start over
            </button>
          </div>
        </div>
        <div
          id="outputBox"
          class="max-h-[36rem] w-full whitespace-pre-wrap break-words overflow-auto rounded-xl border border-zinc-800/80 bg-[#0d0d11]/90 p-4 font-mono text-sm leading-7 text-zinc-300 shadow-2xl sm:p-6"
          tabindex="0"
          aria-label="Generated study roadmap"
        ></div>
        <p id="copyMessage" class="mt-2 min-h-5 text-right text-xs text-zinc-500" aria-live="polite"></p>
      </section>
    </main>

    <footer class="mt-12 border-t border-zinc-900 py-8 text-center font-mono text-[10px] font-semibold uppercase tracking-[0.15em] text-zinc-600">
      Engineered by
      <a
        href="https://gentlecoder.vercel.app"
        target="_blank"
        rel="noopener noreferrer"
        class="text-zinc-500 transition-colors hover:text-cyan-400"
      >GentleCoder</a>
      • Powered by Core Intelligence Engine
    </footer>
  </body>
</html>
